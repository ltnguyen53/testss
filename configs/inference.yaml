# SPEC v2.1 mục 4.2 (threshold policy), mục 7 (enrollment gallery).
#
# File này được SINH/CẬP NHẬT bởi src/evaluation (threshold sweep trên tập
# val) — không tự tay điền `threshold.value`, chỉ điền placeholder trước khi
# chạy sweep lần đầu. Mỗi lần train lại model (config_hash mới — xem
# src/training/checkpoint.py:compute_config_hash), PHẢI sweep + khoá lại
# threshold mới, KHÔNG tái sử dụng threshold cũ (SPEC 4.2 mục 5) — đó là lý do
# `swept_on_config_hash` tồn tại: nếu khác config_hash của model đang
# Production, xem threshold này là KHÔNG hợp lệ cho model hiện tại.
#
# `data.test_csv` CỐ Ý nằm ở ĐÂY, không nằm trong configs/finetune_occlusion.yaml
# — xem comment trong file đó: test.csv không được đọc ở bất kỳ đâu thuộc
# đường train/dev, chỉ eval (file này) mới được chạm vào, đúng 1 lần.

data:
  test_csv: data/splits/test.csv

threshold:
  target_far: 0.01 # FAR mục tiêu lúc sweep (SPEC 4.2: 1% — hợp lý cho demo/portfolio, không cần khắt khe như hệ thống bảo mật thật)
  value: null # ĐIỀN SAU khi chạy sweep (src/evaluation/threshold.py:sweep_tar_at_far) — null = chưa sweep lần nào, KHÔNG được dùng threshold null để serve demo
  swept_on_config_hash: null # config_hash (checkpoint.py) của model version đã dùng để sweep ra threshold này

eval:
  # Tổ hợp đầy đủ cặp impostor là O(n^2) — quá lớn để tính hết trên vài nghìn
  # ảnh, nên sample ngẫu nhiên có seed cố định (SPEC: pairs.py).
  max_impostor_pairs: 5000
  pair_sampling_seed: 42 # tái lập được kết quả sweep giữa các lần chạy

enrollment:
  num_templates_per_identity: 4 # SPEC mục 7: 3-5 template/identity, capture qua vài frame khác góc/biểu cảm lúc đăng ký
  match_strategy: max_similarity # so embedding verification với TOÀN BỘ template, lấy max — xem SPEC mục 7
