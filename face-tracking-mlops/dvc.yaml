stages:
  augment_masks:
    cmd: python -m src.data.preprocessing --config configs/data.yaml
    deps:
      - src/data/preprocessing.py
      - data/raw/rmfd/unmasked
      - data/raw/enrollment
    params:
      - configs/data.yaml:
          - masktheface
    outs:
      - data/processed/masktheface/rmfd
      - data/processed/masktheface/enrollment

  make_splits:
    cmd: python -m src.data.labels --config configs/data.yaml
    deps:
      - src/data/labels.py
      - data/raw/rmfd/masked
      - data/raw/rmfd/unmasked
      - data/processed/masktheface/rmfd
      - data/raw/enrollment
      - data/processed/masktheface/enrollment
    params:
      - configs/data.yaml:
          - seed
          - split
    outs:
      # cache: false (2026-10-07, đã verify bằng thực nghiệm riêng — dựng repo
      # DVC thu nhỏ kiểm chứng) — CSV nhỏ (vài chục KB tới vài MB), để GIT track
      # trực tiếp thay vì đẩy vào DVC cache/remote như file nhị phân lớn:
      #   1. `git diff` xem được THẬT nội dung đổi (identity nào chuyển split
      #      giữa 2 lần chạy) — DVC-cache thì chỉ thấy hash đổi, không thấy gì.
      #   2. `git clone`/`git pull` xong là có CSV ngay, KHÔNG cần `dvc pull`
      #      riêng — đã verify: sau git clone (chưa chạy dvc pull), CSV đọc
      #      được đúng nội dung ngay; `dvc pull` chỉ còn cần cho phần ảnh thật
      #      (data/raw/..., data/processed/masktheface/... — vẫn cache mặc
      #      định, đúng vì đó là nhị phân lớn).
      # dvc.lock vẫn ghi hash của CSV để dvc repro biết khi nào cần chạy lại
      # stage — chỉ riêng NỘI DUNG không đẩy qua DVC remote nữa.
      - data/splits/train.csv:
          cache: false
      - data/splits/val.csv:
          cache: false
      - data/splits/test.csv:
          cache: false
      - data/splits/enrollment_demo.csv:
          cache: false
