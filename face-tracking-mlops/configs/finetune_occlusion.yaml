# Config fine-tune ArcFace occlusion-aware — SPEC v2 mục 3. Mọi giá trị dưới đây là
# ĐIỂM KHỞI ĐẦU chưa dò (chưa có lần train nào), không phải giá trị đã kiểm chứng.
seed: 42

data:
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  # test.csv KHÔNG đọc ở đây — chỉ dùng đúng 1 lần ở eval cuối (SPEC 4.2 bước 4),
  # không dùng để chọn checkpoint hay tune hyperparameter.

backbone:
  # Đã chốt: iresnet của arcface_torch (deepinsight/insightface, recognition/arcface_torch).
  arch: r50                 # tên cho backbones.get_model: r18 | r34 | r50 | r100 (biến config, SPEC v2.1 mục 6)
  num_features: 512         # embedding dim
  dropout: 0.0
  arcface_torch_dir: third_party/insightface/recognition/arcface_torch   # sparse clone, xem README
  pretrained_weights: models/pretrained/backbone.pth   # dvc add; tải tay từ model zoo (Baidu/OneDrive)
  weights_source: models/pretrained/SOURCE.yaml        # SHA256 + nguồn; sai SHA256 -> fail

freeze:
  # Tên block RELATIVE với backbone (code tự thêm tiền tố "backbone."). iresnet:
  # conv1, bn1, prelu, layer1..layer4, bn2, dropout, fc, features (forward đã xác nhận
  # từ iresnet.py chính thức). Sai tên -> apply_freeze_policy raise ValueError kèm danh sách.
  trainable_blocks: ["layer4"]
  # fc là lớp lớn nhất của backbone; với ~400 identity mở fc dễ overfit hơn nhiều so
  # với mở layer4. Chỉ bật khi làm ablation. KHÔNG khai "fc" trong trainable_blocks
  # (validate sẽ raise) — dùng cờ này.
  train_embedding_fc: false
  head_module: head                  # module ArcFace head trong model bọc ngoài (backbone + head)
  train_bn_affine_everywhere: true   # SPEC 3.1: BN gamma/beta + running stats ở MỌI bn* và features
  # ĐÃ XÁC NHẬN (2026-09-29, bằng iresnet18 THẬT của arcface_torch, không phải suy
  # đoán): iresnet.py gốc TỰ đặt features.weight = hằng số 1.0 + requires_grad=False
  # ngay trong __init__ (lựa chọn thiết kế cố ý của ArcFace). Không cần liệt kê
  # "features" ở đây nữa — apply_freeze_policy (model_setup.py) giờ TỰ ĐỘNG phát
  # hiện và giữ nguyên mọi param mà kiến trúc gốc đã tự frozen từ trước (bất kể
  # bn_affine_exclude_modules rỗng hay không), đồng thời vẫn unfreeze đúng
  # features.bias (KHÔNG bị upstream cố định). Để [] là đủ, không cần cấu hình gì
  # thêm cho trường hợp này.
  bn_affine_exclude_modules: []

head:
  # num_classes KHÔNG hardcode: = số identity trong train.csv (PKBatchSampler.num_classes),
  # không phải 525 — split identity-disjoint (SPEC 3.2). Eval bỏ head, chỉ dùng embedding.
  arcface_margin: 0.35   # SPEC 3.2: phải dò, thử NHỎ hơn giá trị paper gốc (0.5); 0.35 chỉ là điểm bắt đầu
  arcface_scale: 64.0    # giữ giá trị paper gốc

optimizer:
  # Discriminative LR (SPEC 3.1): head > backbone unfrozen. Ví dụ trong spec: 1e-3 / 1e-5.
  head_lr: 1.0e-3
  backbone_unfrozen_lr: 1.0e-5
  bn_affine_lr: 1.0e-5   # BN affine ở các block bị freeze conv (giá trị này do tôi chọn, spec không nêu)
  weight_decay: 5.0e-4
  bn_affine_weight_decay: 0.0   # thông lệ: không decay gamma/beta (do tôi chọn, spec không nêu)

training:
  # BỔ SUNG 2026-09-29 (README từng flag thiếu — SGD/Adam, tổng step/epoch, AMP —
  # khi viết train.py lần đầu). optimizer_type=sgd vì optimizer.*_lr ở trên (1e-3,
  # 1e-5) là giá trị hợp lý cho SGD, KHÔNG hợp lý cho Adam (Adam thường cần LR nhỏ
  # hơn nhiều, LR kiểu SGD sẽ làm Adam phân kỳ) — 2 optimizer không dùng chung 1 bộ
  # LR. Muốn đổi sang Adam thì phải tự dò lại toàn bộ optimizer.*_lr, không chỉ đổi
  # optimizer_type.
  optimizer_type: sgd
  momentum: 0.9        # chỉ dùng khi optimizer_type=sgd
  epochs: 30            # ĐIỂM KHỞI ĐẦU chưa dò, giống mọi giá trị khác trong file này
  amp: false            # AMP (mixed precision): để false cho lần train đầu, tránh
                          # thêm 1 biến chưa biết cùng lúc với nhiều thay đổi khác

sampler:
  identities_per_batch: 16   # P — batch = P*K = 64
  images_per_identity: 4     # K
  masked_per_identity: 2     # trong K ảnh: 2 masked (thật, thiếu thì synthetic cùng identity) + 2 unmasked

checkpoint:
  save_every_n_steps: 500
  keep_last_n: 2
  dir: /content/drive/MyDrive/face-tracking-mlops/checkpoints   # sửa theo Drive của bạn

mlflow:
  experiment_name: face-recognition-occlusion
  registered_model_name: face-recognition-occlusion
